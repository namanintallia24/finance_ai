{% extends "finance_app/base.html" %}
{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: #f5f6fa;
        margin: 0;
        padding: 0;
    }
    .container {
        padding: 30px;
        max-width: 800px;
        margin: auto;
    }
    .card {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        margin-bottom: 20px;
    }
    .card h2 {
        margin-bottom: 10px;
        font-size: 20px;
        color: #2c3e50;
    }
    .timestamp {
        font-size: 12px;
        color: gray;
        margin-bottom: 15px;
    }
    .response-box {
        background: #ecf0f1;
        padding: 15px;
        border-radius: 8px;
        margin-top: 10px;
    }
    a.back-link {
        display: inline-block;
        margin-top: 15px;
        text-decoration: none;
        color: #2980b9;
        font-weight: 600;
    }
    a.back-link:hover {
        text-decoration: underline;
    }
</style>

<div class="container">
    <div class="card">
        <h2>🔍 Query Detail</h2>
        <div class="timestamp">📅 {{ history.created_at|date:"M d, Y H:i" }}</div>
        <p><strong>Query:</strong> {{ history.query }}</p>

        {% if history.response %}
            <div class="response-box">
                <strong>Response:</strong>
                <p>{{ history.response }}</p>
            </div>
        {% endif %}
    </div>

    <a href="{% url 'dashboard' %}" class="back-link">⬅ Back to Dashboard</a>
</div>

{% endblock %}
