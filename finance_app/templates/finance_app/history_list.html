{% extends "finance_app/base.html" %}
{% block content %}
<h2>Your Query History</h2>
<ul>
    {% for item in histories %}
        <li>
            <a href="{% url 'history_detail' item.id %}">
                {{ item.query|truncatechars:50 }}
            </a> - {{ item.created_at|date:"M d, Y H:i" }}
        </li>
    {% empty %}
        <p>No history found.</p>
    {% endfor %}
</ul>
{% endblock %}
